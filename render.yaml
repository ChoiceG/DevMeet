databases:
  - name: DevMeet # Changed the name to DeevMatchs
    databaseName: devmeet
    user: devmeet
    plan: free

services:
  - type: web
    name: DevMeet # Changed the name to DeevMatchs
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    # preDeployCommand: "bundle exec rails db:migrate" # preDeployCommand only available on paid instance types
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: DevMeet # Changed the name to DeevMatchs to match the database
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2 # sensible default
